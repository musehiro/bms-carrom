# Play Games Services (plugin v3.4.0): the numeric Play Games application
# ID (Project ID) from Play Console > Play Games Services > Configuration.
# PLACEHOLDER — "000000000000" is NOT a real ID. Replace it with the real
# numeric ID once the Console PGS Configuration step is done; until then
# sign-in will fail and PlayGames stays inert. Do NOT hand-edit
# android/build/res/values/strings.xml or the manifest for this — the
# plugin injects the ID at export time. See scripts/play_games.gd.
godot_play_game_services/game_id="000000000000"
